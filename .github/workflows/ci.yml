# Runs the tests and builds the app on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build the app
        run: ./scripts/build-app.sh
