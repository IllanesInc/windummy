# Push a tag like v0.2.0 and this builds WinDummy.app and attaches it, zipped,
# to a GitHub release with notes generated from the commits.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The app is signed ad hoc, not notarized (that needs a paid Apple Developer
# account), so the first launch needs right-click → Open. See the README.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build the app
        run: APP_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh

      - name: Zip it
        # ditto keeps the signature and extended attributes intact; plain zip does not.
        run: ditto -c -k --keepParent build/WinDummy.app WinDummy.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" WinDummy.zip --title "WinDummy ${GITHUB_REF_NAME#v}" --generate-notes
